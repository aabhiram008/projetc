name: esp32_medicine_dispenser
description: Tablet-first Flutter prototype for an ESP32 medicine dispenser.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  just_audio: ^0.9.40
  usb_serial: ^0.5.2
  screen_brightness: ^2.1.1

 dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
